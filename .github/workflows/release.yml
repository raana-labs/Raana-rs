name: Release Runtime

on:
  push:
    tags: ['rust-support-*']

jobs:
  build-runtime:
    strategy:
      matrix:
        kmi:
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: rev
        run: echo "rev=$(cat rust-support.rev)" >> "$GITHUB_OUTPUT"
      - run: git clone https://github.com/Dere3046/RaanaSDK.git rust_support
      - run: git -C rust_support checkout ${{ steps.rev.outputs.rev }}
      - run: |
          cd rust_support
          SDKREV=$(cat .sdk-version)
          git clone https://github.com/Dere3046/KMSDK.git .sdk
          git -C .sdk checkout "$SDKREV"
          ./.sdk/scripts/sdk install
      - run: cd rust_support && ./scripts/build-ddkk.sh ${{ matrix.kmi }}
      - run: |
          mkdir -p artifact-staging/${{ matrix.kmi }}
          cp -a rust_support/out/${{ matrix.kmi }}/. artifact-staging/${{ matrix.kmi }}/
          echo "{\"rev\":\"${{ steps.rev.outputs.rev }}\",\"target\":\"${{ matrix.kmi }}\"}" > artifact-staging/${{ matrix.kmi }}/artifact.json
          tar -C artifact-staging/${{ matrix.kmi }} -czf rust-support-${{ matrix.kmi }}.tar.gz .
      - uses: softprops/action-gh-release@v2
        with:
          files: rust-support-${{ matrix.kmi }}.tar.gz
