name: CI

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: ./target/release/raana new --c ctest
      - run: mkdir -p ctest/.cache
      - run: ./target/release/raana build --manifest ctest/lkm.toml --target android16-6.12
      - run: test -f ctest/out/android16-6.12/ctest.ko
